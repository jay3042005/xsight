<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>XSIGHT Transfer</title>
<style>
  :root { --surface:#DCEDEA; --teal:#1B6B6F; --slate:#2F3E46; --sage:#6C9A8B; }
  @media (prefers-color-scheme: dark) { :root { --surface:#2F3E46; --slate:#DCEDEA; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center;
         background:var(--surface); color:var(--slate); text-align:center;
         font:400 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding:24px; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.4px; margin:0 0 10px; }
  p { color:var(--sage); max-width:34ch; margin:0 auto; }
  strong { color:var(--teal); }
</style>
</head>
<body>
  <div>
    <h1>XSIGHT Transfer</h1>
    <p>This page only works from a code shown on an XSIGHT kiosk.
       Scan the QR on the kiosk screen to continue.</p>
  </div>
</body>
</html>
