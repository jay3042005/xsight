name: xsight_app
description: "XSIGHT — IoT AI Chatbot Robot for Thoracic Assessment (Mobile App)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  go_router: ^14.6.1
  camera: ^0.11.0+2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: 11.3.1
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  record: ^6.1.1
  flutter_soloud: ^3.1.10
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5
  sqflite: ^2.3.0
  intl: ^0.19.0
  flutter_libserialport: ^0.6.0
  usb_serial: ^0.5.2
  qr_flutter: ^4.1.0
  flutter_classic_bluetooth: ^0.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/normal_chest_xray.jpg
    # Pre-recorded kiosk voice guidance. Filenames are the cue ids in
    # voice-guide.md; a cue with no file here simply stays silent.
    - assets/voice/en/
